# /rw/config/vlan-coupling.conf  (in sys-net)
#
# One line per DIRECTLY-ATTACHED network-providing qube:
#   <qube-ip>   <uplink-iface>   [<dns-override>]
#
# qube-ip       : the qube's Qubes-internal IP (qvm-ls -n)
# uplink-iface  : sys-net interface that VLAN exits through (ens7, ens7.13, ...)
# dns-override  : optional; resolver for this VLAN. If omitted, the DHCP-learned
#                 DNS for that uplink is used (usually the gateway).
#
# Only list qubes whose vif lives in THIS qube. Downstream qubes (behind a
# firewall qube) are routed by their firewall, never listed here.

#
# For my system, vlan 01 is native on ens7.  The others are tagged.
# The IPs are the IPs assigned by qubes to the sys-firewall clones I created
# for each vlan.
#
# If you turn off `start autobatically` in the sys-firewall_vlanX clone, they will
# be run on demand.
#
#10.138.13.46    ens7
#10.138.18.201   ens7.3
#10.138.26.140   ens7.4
#10.138.24.90    ens7.13

# Force ALL port-53 traffic from the listed qubes to the per-VLAN resolver,
# even if the qube queries public DNS directly (e.g. hardcoded 8.8.8.8,
# DoT-style stubs using plain UDP/53). Internal qube-to-qube traffic is
# never affected (it is unmarked). Set to "no" to only rewrite the Qubes
# DNS stubs (10.139.1.x).
BLANKET_DNS=yes
